<style>
  .parking-chat { position: fixed; right: 24px; bottom: 24px; z-index: 2000; font: 14px/1.5 system-ui, sans-serif; color: #183a2d; }
  .parking-chat * { box-sizing: border-box; }
  .parking-chat [hidden] { display: none !important; }
  .parking-chat button { cursor: pointer; font: inherit; }
  .parking-chat .chat-launch { width: auto; height: auto; margin: 0; padding: 14px 18px; border: 0; border-radius: 99px; background: #17563d; color: white; font-weight: 750; box-shadow: 0 12px 28px #123d2b40; }
  .parking-chat .chat-window { width: min(380px, calc(100vw - 32px)); height: min(570px, calc(100dvh - 110px)); min-height: 300px; margin-bottom: 12px; display: flex; flex-direction: column; background: #fff; border: 1px solid #cfdfd5; border-radius: 22px; overflow: hidden; box-shadow: 0 20px 60px #123b2d35; }
  .parking-chat .chat-header { padding: 16px 18px; background: #174c39; color: #fff; display: flex; align-items: center; justify-content: space-between; }
  .parking-chat .chat-header strong { font-size: 15px; }
  .parking-chat .chat-header small { display: block; margin-top: 2px; color: #d5eadd; font-size: 11px; }
  .parking-chat .chat-close { width: 32px; height: 32px; margin: 0; padding: 0; border: 0; border-radius: 50%; color: #fff; background: #ffffff24; font-size: 20px; }
  .parking-chat .chat-log { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; background: #f5f8f5; }
  .parking-chat .chat-bubble { max-width: 92%; margin: 0 0 10px; padding: 11px 13px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; background: #fff; color: #25443a; border: 1px solid #e2ebe4; }
  .parking-chat .chat-bubble.user { margin-left: auto; background: #dceee1; border-color: #dceee1; }
  .parking-chat .chat-bubble small { display: block; color: #587466; margin-top: 6px; }
  .parking-chat .chat-loading { display: flex; align-items: center; gap: 9px; width: fit-content; color: #587466; }
  .parking-chat .chat-spinner { width: 16px; height: 16px; border: 2px solid #d4e4d8; border-top-color: #1a6847; border-radius: 50%; animation: chat-spin .8s linear infinite; }
  @keyframes chat-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .parking-chat .chat-spinner { animation-duration: 2s; } }
  .parking-chat .chat-disclosure { margin: 0; padding: 8px 16px 0; color: #5e766b; font-size: 11px; }
  .parking-chat .chat-compose { display: flex; gap: 8px; padding: 12px; }
  .parking-chat .chat-compose input { flex: 1; min-width: 0; width: auto; height: 42px; padding: 0 12px; border: 1px solid #cadcd0; border-radius: 10px; background: #fff; color: #17392a; font: inherit; }
  .parking-chat .chat-compose button { width: auto; height: 42px; margin: 0; padding: 0 14px; border: 0; border-radius: 10px; background: #1a6847; color: #fff; font-weight: 700; }
  .parking-chat .chat-compose button:disabled { opacity: .55; cursor: wait; }
  .parking-chat :focus-visible { outline: 3px solid #76d39a; outline-offset: 2px; }
  @media (max-width: 600px) { .parking-chat { right: 16px; bottom: 16px; } }
</style>
<aside class="parking-chat" aria-label="AI 주차장 도우미">
  <section class="chat-window" id="floating-chat-window" aria-label="AI 주차장 대화" hidden>
    <div class="chat-header"><div><strong>AI 주차장 도우미</strong><small>어느 화면에서나 이어서 대화해요</small></div><button class="chat-close" id="floating-chat-close" type="button" aria-label="대화창 닫기">×</button></div>
    <div class="chat-log" id="floating-chat-log" role="log" aria-live="polite"></div>
    <p class="chat-disclosure">비로그인·일반 회원 하루 3회, 관리자 10회 · 대화와 현재 검색 결과는 Google Gemini에 전송됩니다.</p>
    <form class="chat-compose" id="floating-chat-form" action="{{ url_for('parking_demo.assistant') }}" method="post">
      <input type="hidden" name="form_token" value="{{ form_token }}">
      <input name="message" maxlength="500" required aria-label="메시지" placeholder="예: 서울역 근처 무료 주차장">
      <button type="submit">보내기</button>
    </form>
  </section>
  <button type="button" class="chat-launch" id="floating-chat-launch" aria-controls="floating-chat-window" aria-expanded="false">✦ AI 주차장 도우미</button>
</aside>
<script>
(() => {
  const windowEl = document.getElementById('floating-chat-window');
  const launch = document.getElementById('floating-chat-launch');
  const close = document.getElementById('floating-chat-close');
  const log = document.getElementById('floating-chat-log');
  const form = document.getElementById('floating-chat-form');
  const storageKey = 'parking-chat-v1';
  const loginFavorite = {{ login_favorite_feedback | default(none) | tojson }};
  const loginFavoriteError = {{ login_favorite_error | default(none) | tojson }};
  let state = {open: false, messages: []};
  try { const saved = JSON.parse(sessionStorage.getItem(storageKey) || 'null'); if (saved && Array.isArray(saved.messages)) state = {open: !!saved.open, messages: saved.messages.slice(-16)}; } catch (_) {}
  if (loginFavorite) { state.open = true; state.messages.push({role: 'assistant', text: `${loginFavorite.place_name} · 첫 결과: ${loginFavorite.result_label} · 선택한 행동: ${loginFavorite.next_action}`}); }
  if (loginFavoriteError) { state.open = true; state.messages.push({role: 'assistant', text: loginFavoriteError}); }
  function save() { try { sessionStorage.setItem(storageKey, JSON.stringify(state)); } catch (_) {} }
  function render() {
    windowEl.hidden = !state.open;
    launch.setAttribute('aria-expanded', String(state.open));
    log.replaceChildren();
    if (!state.messages.length) {
      const welcome = document.createElement('div'); welcome.className = 'chat-bubble'; welcome.textContent = '안녕하세요! 목적지나 궁금한 주차 정보를 말씀해 주세요.'; log.appendChild(welcome);
    }
    state.messages.forEach((entry) => {
      const bubble = document.createElement('div'); bubble.className = 'chat-bubble' + (entry.role === 'user' ? ' user' : '');
      bubble.textContent = entry.text;
      if (Array.isArray(entry.places)) entry.places.forEach((place) => { const detail = document.createElement('small'); detail.textContent = `${place.name} · ${place.distance_km}km · ${place.area}`; bubble.appendChild(detail); });
      if (entry.link === 'https://www.data.go.kr/data/15012896/standard.do') { const link = document.createElement('a'); link.href = entry.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = ' 데이터 출처 열기 ↗'; bubble.appendChild(link); }
      log.appendChild(bubble);
    });
    log.scrollTop = log.scrollHeight;
    save();
  }
  function showLoading() {
    const indicator = document.createElement('div');
    indicator.className = 'chat-bubble chat-loading';
    indicator.setAttribute('role', 'status');
    indicator.setAttribute('aria-label', 'AI가 답변을 준비하고 있습니다');
    const spinner = document.createElement('span'); spinner.className = 'chat-spinner'; spinner.setAttribute('aria-hidden', 'true');
    const label = document.createElement('span'); label.textContent = 'AI가 답변을 준비하고 있어요…';
    indicator.append(spinner, label);
    log.appendChild(indicator);
    log.scrollTop = log.scrollHeight;
    return indicator;
  }
  launch.addEventListener('click', () => { state.open = !state.open; render(); if (state.open) form.elements.message.focus(); });
  close.addEventListener('click', () => { state.open = false; render(); launch.focus(); });
  document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && state.open) { state.open = false; render(); launch.focus(); } });
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const button = form.querySelector('button'); const input = form.elements.message; const body = new FormData(form);
    const originalButtonText = button.textContent;
    state.messages.push({role: 'user', text: input.value}); state.messages = state.messages.slice(-16); input.value = ''; button.disabled = true; button.textContent = '응답 중…'; render();
    const loading = showLoading();
    try {
      const response = await fetch(form.action, {method: 'POST', body});
      const data = await response.json().catch(() => ({}));
      let text = data.message || (response.status === 429 ? '요청이 너무 많습니다. 잠시 후 다시 시도해 주세요.' : '응답을 받지 못했습니다. 잠시 후 다시 시도해 주세요.');
      if (Number.isInteger(data.remaining)) text += `\n오늘 남은 횟수: ${data.remaining}회`;
      state.messages.push({role: 'assistant', text, places: data.places || [], link: data.link || ''});
      if (data.theme === 'dark' || data.theme === 'light') {
        document.documentElement.dataset.theme = data.theme;
        try { localStorage.setItem('parking-theme', data.theme); } catch (_) {}
        window.dispatchEvent(new CustomEvent('parking:theme'));
      }
      if (data.preferences) window.dispatchEvent(new CustomEvent('parking:preferences', {detail: data.preferences}));
      if (data.favorites_changed) {
        window.dispatchEvent(new CustomEvent('parking:favorites', {detail: data.favorite_feedback || null}));
        if (!document.getElementById('favorite-list')) {
          if (data.favorite_feedback) try { sessionStorage.setItem('parking-pending-favorite', JSON.stringify(data.favorite_feedback)); } catch (_) {}
          data.navigate = {{ url_for('parking_demo.parking', from_chat='1') | tojson }} + '#favorite-heading';
        }
      }
      if (data.search) {
        if (document.getElementById('results-body')) window.dispatchEvent(new CustomEvent('parking:search', {detail: data.search}));
        else data.navigate = {{ url_for('parking_demo.parking', from_chat='1') | tojson }};
      }
      const operation = data.open_favorites ? {type: 'favorites'} : Number.isInteger(data.map_index) ? {type: 'map_select', value: data.map_index} : data.map_zoom ? {type: 'map_zoom', value: data.map_zoom} : data.guide ? {type: 'guide', value: data.guide} : null;
      if (operation) {
        if (document.getElementById('results-body')) window.dispatchEvent(new CustomEvent('parking:operation', {detail: operation}));
        else {
          try { sessionStorage.setItem('parking-pending-operation', JSON.stringify(operation)); } catch (_) {}
          data.navigate = {{ url_for('parking_demo.parking', from_chat='1') | tojson }};
        }
      }
      if (data.admin_changed && window.location.pathname === {{ url_for('parking_demo.admin') | tojson }}) data.navigate = {{ url_for('parking_demo.admin') | tojson }};
      if (data.navigate) { state.messages = state.messages.slice(-16); save(); window.location.assign(data.navigate); }
    } catch (_) { state.messages.push({role: 'assistant', text: '서버에 연결하지 못했습니다. 잠시 후 다시 시도해 주세요.'}); }
    finally { loading.remove(); state.messages = state.messages.slice(-16); button.disabled = false; button.textContent = originalButtonText; render(); }
  });
  window.addEventListener('DOMContentLoaded', () => {
    if (!document.getElementById('results-body')) return;
    if (loginFavorite) window.dispatchEvent(new CustomEvent('parking:favorites', {detail: loginFavorite}));
    try {
      const pending = JSON.parse(sessionStorage.getItem('parking-pending-operation') || 'null');
      sessionStorage.removeItem('parking-pending-operation');
      if (pending) window.dispatchEvent(new CustomEvent('parking:operation', {detail: pending}));
      const favorite = JSON.parse(sessionStorage.getItem('parking-pending-favorite') || 'null');
      sessionStorage.removeItem('parking-pending-favorite');
      if (favorite) window.dispatchEvent(new CustomEvent('parking:favorites', {detail: favorite}));
    } catch (_) {}
  });
  render();
})();
</script>
