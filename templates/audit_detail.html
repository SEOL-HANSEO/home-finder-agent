<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>활동 원본 기록</title><style>body{font:16px/1.6 system-ui;color:#17372e;background:#f1f6f2;max-width:700px;margin:40px auto;padding:0 20px}main{background:#fff;padding:24px;border-radius:16px}dt{font-weight:700;margin-top:12px}dd{margin:0;overflow-wrap:anywhere}a{color:#126b4b}</style></head><body><a href="{{ url_for('parking_demo.admin') }}#report">← 보고서로 돌아가기</a><main><h1>활동 원본 기록</h1><dl><dt>기록 번호</dt><dd>{{ log.id }}</dd><dt>시각 (UTC)</dt><dd>{{ log.created_at }}</dd><dt>계정 별칭</dt><dd>{{ log.actor_alias }}</dd><dt>행동</dt><dd>{{ log.action }}</dd><dt>판정</dt><dd>{{ log.outcome }}</dd><dt>결과 수</dt><dd>{{ log.result_count }}</dd><dt>제공자 호출</dt><dd>{{ log.provider_calls }}</dd></dl></main></body></html>
